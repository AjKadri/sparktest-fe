# CI: installs Fe 26.7.0 (commit e6e6342) and runs the whole suite. Not run locally: it first runs on GitHub after a push.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # The release asset is downloaded directly and checked against the sha256 digest GitHub lists for it
      # (releases/tags/v26.7.0 -> assets[].digest); nothing is fetched from a moving branch.
      - name: Install Fe 26.7.0
        run: |
          mkdir -p "$HOME/.fe/bin"
          curl -fsSL -o "$HOME/.fe/bin/fe" https://github.com/argotorg/fe/releases/download/v26.7.0/fe_linux_amd64
          echo "4ef2b818e260f0ba0b0af4bd78468dda589dc4949503fffaef25d8188e5107d5  $HOME/.fe/bin/fe" | sha256sum -c -
          chmod +x "$HOME/.fe/bin/fe"
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          fe --version
          node --version
          python3 --version
          fe --version | grep -F "fe 26.7.0 (e6e6342)"

      - name: fe check at the repository root
        run: fe check

      - name: Whole suite
        run: ./scripts/test-all.sh
