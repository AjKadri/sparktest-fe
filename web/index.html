<!doctype html>
<meta charset="utf-8">
<title>fe-quickcheck wasm spike</title>
<body style="font-family:monospace;max-width:40em;margin:2em auto">
<h3>fe-quickcheck in the browser (Fe → wasm)</h3>
<p>Property: <code>x &lt; limit</code> for x = xorshift64(seed) % 100000</p>
<label>seed <input id="seed" value="12345"></label>
<label>cases <input id="cases" value="1000"></label>
<label>limit <input id="limit" value="99000"></label>
<button id="run">Run property</button>
<pre id="out">loading…</pre>
<script>
const out = document.getElementById('out');
let instance, mem, firstFail, revert;
const imports = { env: {
  qc_fail: (input, caseNo) => { firstFail = { input, caseNo }; },     // i64 arrives as BigInt
  __fe_revert: (addr, len) => { revert = Array.from(new Uint8Array(mem.buffer, addr, len)).map(b => b.toString(16).padStart(2,'0')).join(''); throw new Error('guest revert 0x' + revert); },
}};
WebAssembly.instantiateStreaming(fetch('qc_wasm.wasm'), imports).then(({ instance: i }) => {
  instance = i; mem = i.exports.memory; out.textContent = 'ready. exports: ' + Object.keys(i.exports).join(', ');
}).catch(e => out.textContent = 'load failed: ' + e);
document.getElementById('run').onclick = () => {
  firstFail = null;
  const seed = BigInt(document.getElementById('seed').value), cases = +document.getElementById('cases').value, limit = BigInt(document.getElementById('limit').value);
  const t0 = performance.now();
  try {
    const failures = instance.exports.run_below(seed, cases, limit);
    const ms = (performance.now() - t0).toFixed(2);
    out.textContent = failures === 0
      ? `PASS: ${cases} cases, 0 failures (${ms} ms)`
      : `FAIL: ${failures}/${cases} failing. first counterexample x=${firstFail.input} at case ${firstFail.caseNo} (${ms} ms)`;
  } catch (e) { out.textContent = 'ERROR: ' + e.message; }
};
</script>
